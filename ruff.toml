line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S"]
ignore = [
    "S101",  # assert is used intentionally for narrowing and invariant checks
]

[lint.per-file-ignores]
"src/eval/**" = [
    "S311",  # eval synthesis uses seeded random (not cryptographic)
    "S607",  # git partial-path in reporter._git_sha is intentional
]
"scripts/**" = [
    "S607",  # scripts use git/system commands with partial paths intentionally
]
"tests/**" = [
    "S311",  # tests use random freely
    "S607",  # tests use system commands (grep, git) intentionally
]
