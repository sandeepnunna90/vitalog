[project]
name = "vitalog"
version = "0.1.0"
description = "MCP-first health intelligence tool for chronic-condition patients"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "supabase>=2.0.0",
    "boto3>=1.34.0",
    "mcp>=1.0.0",
    "reportlab>=4.0.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]
