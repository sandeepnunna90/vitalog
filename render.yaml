services:
  - type: web
    name: vitalog-mcp
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: MCP_TRANSPORT
        value: sse
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: BASE_URL
        value: https://vitalog-9z6b.onrender.com
      # OAuth state is kept in-memory: must stay single-instance.
      # Scale to >1 instance only after migrating state to Redis/DB.
      - key: RENDER_MAX_INSTANCES
        value: "1"
